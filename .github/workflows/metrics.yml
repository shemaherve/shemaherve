name: Metrics
on:
  # Schedule daily updates at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main branch
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token (uses built-in GITHUB_TOKEN or custom METRICS_TOKEN if configured)
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Target user options
          user: shemaherve
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Kigali
          config_order: base.header, languages, habits, achievements

          # Output destination
          output_action: commit
          committer_message: "chore: update github-metrics.svg [skip ci]"

          # Plugin: Languages (includes Go, TypeScript, JavaScript, PHP, Java, Python)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Plugin: Coding Habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Plugin: Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
