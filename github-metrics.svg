<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" fill="none">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
      .text-primary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #58a6ff; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #8b949e; }
      .text-stat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #f0f6fc; }
      .text-num { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #58a6ff; }
      .text-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; }
      .bar-bg { fill: #21262d; rx: 3px; }
      .bar-fill { rx: 3px; }
      .badge { fill: #21262d; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="799" height="419" class="bg" />

  <!-- Top Header Section -->
  <g transform="translate(24, 24)">
    <!-- Octicon Mark -->
    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" transform="scale(1.5)" fill="#58a6ff" />
    <text x="36" y="18" class="text-title">Dusabe Shema Herve</text>
    <text x="215" y="18" class="text-muted">(@shemaherve)</text>
    <text x="36" y="34" class="text-muted">Kigali, Rwanda (UTC+2) · Available for Opportunities · lowlighter/metrics 3.35.0</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="74" x2="776" y2="74" stroke="#30363d" stroke-width="1" />

  <!-- Left Column: Core Community & Activity Stats -->
  <g transform="translate(24, 90)">
    <rect x="0" y="0" width="360" height="180" class="card-bg" />
    
    <text x="16" y="24" class="text-primary">Contribution &amp; Profile Activity</text>

    <!-- Stat 1: Total Contributions -->
    <g transform="translate(16, 44)">
      <circle cx="6" cy="6" r="4" fill="#39d353" />
      <text x="18" y="10" class="text-stat">Contributions in the last year</text>
      <text x="328" y="10" text-anchor="end" class="text-num">904</text>
    </g>

    <!-- Stat 2: Repositories -->
    <g transform="translate(16, 72)">
      <circle cx="6" cy="6" r="4" fill="#58a6ff" />
      <text x="18" y="10" class="text-stat">Public Repositories</text>
      <text x="328" y="10" text-anchor="end" class="text-num">18</text>
    </g>

    <!-- Stat 3: Followers -->
    <g transform="translate(16, 100)">
      <circle cx="6" cy="6" r="4" fill="#d2a8ff" />
      <text x="18" y="10" class="text-stat">Followers &amp; Following</text>
      <text x="328" y="10" text-anchor="end" class="text-num">16 · 10</text>
    </g>

    <!-- Stat 4: Stargazers -->
    <g transform="translate(16, 128)">
      <circle cx="6" cy="6" r="4" fill="#e3b341" />
      <text x="18" y="10" class="text-stat">Starred Repositories</text>
      <text x="328" y="10" text-anchor="end" class="text-num">1</text>
    </g>

    <!-- Progress bar under stats -->
    <g transform="translate(16, 156)">
      <rect x="0" y="0" width="328" height="6" class="bar-bg" />
      <rect x="0" y="0" width="220" height="6" fill="#238636" class="bar-fill" />
      <rect x="220" y="0" width="70" height="6" fill="#1f6feb" class="bar-fill" />
      <rect x="290" y="0" width="38" height="6" fill="#a371f7" class="bar-fill" />
    </g>
  </g>

  <!-- Right Column: Languages Breakdown (Including Go) -->
  <g transform="translate(416, 90)">
    <rect x="0" y="0" width="360" height="180" class="card-bg" />
    <text x="16" y="24" class="text-primary">Most Used Languages</text>

    <!-- Multi-segment language bar -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="328" height="8" class="bar-bg" />
      <rect x="0" y="0" width="105" height="8" fill="#3178c6" class="bar-fill" />   <!-- TypeScript 32% -->
      <rect x="105" y="0" width="75" height="8" fill="#00add8" class="bar-fill" />  <!-- Go 23% -->
      <rect x="180" y="0" width="56" height="8" fill="#f1e05a" class="bar-fill" />  <!-- JS 17% -->
      <rect x="236" y="0" width="46" height="8" fill="#4f5d95" class="bar-fill" />  <!-- PHP 14% -->
      <rect x="282" y="0" width="30" height="8" fill="#b07219" class="bar-fill" />  <!-- Java 9% -->
      <rect x="312" y="0" width="16" height="8" fill="#3572a5" class="bar-fill" />  <!-- Python 5% -->
    </g>

    <!-- Language Items Grid -->
    <g transform="translate(16, 68)">
      <!-- Row 1 -->
      <circle cx="6" cy="6" r="5" fill="#3178c6" />
      <text x="18" y="10" class="text-stat">TypeScript</text>
      <text x="140" y="10" class="text-muted">32.0%</text>

      <circle cx="180" cy="6" r="5" fill="#00add8" />
      <text x="192" y="10" class="text-stat" font-weight="700">Go (Golang)</text>
      <text x="314" y="10" class="text-muted">23.0%</text>

      <!-- Row 2 -->
      <circle cx="6" cy="34" r="5" fill="#f1e05a" />
      <text x="18" y="38" class="text-stat">JavaScript</text>
      <text x="140" y="38" class="text-muted">17.0%</text>

      <circle cx="180" cy="34" r="5" fill="#4f5d95" />
      <text x="192" y="38" class="text-stat">PHP</text>
      <text x="314" y="38" class="text-muted">14.0%</text>

      <!-- Row 3 -->
      <circle cx="6" cy="62" r="5" fill="#b07219" />
      <text x="18" y="66" class="text-stat">Java</text>
      <text x="140" y="66" class="text-muted">9.0%</text>

      <circle cx="180" cy="62" r="5" fill="#3572a5" />
      <text x="192" y="66" class="text-stat">Python</text>
      <text x="314" y="66" class="text-muted">5.0%</text>
    </g>
  </g>

  <!-- Bottom Row: Coding Habits & Verified Achievements -->
  <g transform="translate(24, 286)">
    <!-- Habits Section (Left 470px) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="470" height="110" class="card-bg" />
      <text x="16" y="24" class="text-primary">Coding Habits &amp; Commit Schedule</text>

      <!-- Time blocks -->
      <g transform="translate(16, 42)">
        <text x="0" y="12" class="text-tag">Morning (06-12)</text>
        <rect x="90" y="2" width="130" height="10" class="bar-bg" />
        <rect x="90" y="2" width="42" height="10" fill="#3fb950" class="bar-fill" />
        <text x="228" y="12" class="text-muted">32%</text>

        <text x="260" y="12" class="text-tag">Day (12-18)</text>
        <rect x="330" y="2" width="80" height="10" class="bar-bg" />
        <rect x="330" y="2" width="36" height="10" fill="#58a6ff" class="bar-fill" />
        <text x="418" y="12" class="text-muted">45%</text>
      </g>

      <g transform="translate(16, 70)">
        <text x="0" y="12" class="text-tag">Evening (18-24)</text>
        <rect x="90" y="2" width="130" height="10" class="bar-bg" />
        <rect x="90" y="2" width="24" height="10" fill="#d29922" class="bar-fill" />
        <text x="228" y="12" class="text-muted">18%</text>

        <text x="260" y="12" class="text-tag">Night (00-06)</text>
        <rect x="330" y="2" width="80" height="10" class="bar-bg" />
        <rect x="330" y="2" width="4" height="10" fill="#8b949e" class="bar-fill" />
        <text x="418" y="12" class="text-muted">5%</text>
      </g>
    </g>

    <!-- Achievements Section (Right 266px) -->
    <g transform="translate(486, 0)">
      <rect x="0" y="0" width="266" height="110" class="card-bg" />
      <text x="16" y="24" class="text-primary">Achievements</text>

      <g transform="translate(16, 42)">
        <!-- Badge 1: Pull Shark -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="68" height="52" class="badge" />
          <text x="34" y="26" text-anchor="middle" font-size="18">🦈</text>
          <text x="34" y="44" text-anchor="middle" class="text-tag">Pull Shark</text>
        </g>

        <!-- Badge 2: Quickdraw -->
        <g transform="translate(78, 0)">
          <rect x="0" y="0" width="74" height="52" class="badge" />
          <text x="37" y="26" text-anchor="middle" font-size="18">⚡</text>
          <text x="37" y="44" text-anchor="middle" class="text-tag">Quickdraw</text>
        </g>

        <!-- Badge 3: YOLO -->
        <g transform="translate(162, 0)">
          <rect x="0" y="0" width="68" height="52" class="badge" />
          <text x="34" y="26" text-anchor="middle" font-size="18">🎯</text>
          <text x="34" y="44" text-anchor="middle" class="text-tag">YOLO</text>
        </g>
      </g>
    </g>
  </g>
</svg>
